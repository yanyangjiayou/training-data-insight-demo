    function b64ToUtf8(b64){
      const bin = atob(b64);
      const len = bin.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }
    const frames = [document.getElementById('f0'), document.getElementById('f1'), document.getElementById('f2')];
    frames.forEach(function(f, i){
      try {
        const doc = f.contentDocument || f.contentWindow.document;
        doc.open(); doc.write(b64ToUtf8(B64[i])); doc.close();
      } catch (e) {
        const doc = f.contentDocument || f.contentWindow.document;
        doc.body.innerHTML = '<p style="padding:20px;color:#c00">加载失败：' + e.message + '</p>';
      }
    });
    const tabs  = document.querySelectorAll('.tab');
    const panes = document.querySelectorAll('.pane');
    tabs.forEach(function(t){
      t.addEventListener('click', function(){
        const i = +t.dataset.i;
        tabs.forEach(function(x){ x.classList.toggle('active', x === t); });
        panes.forEach(function(p){ p.classList.toggle('active', +p.dataset.i === i); });
      });
    });
